 {% extends "base.html" %}
{% block title %}Register Luggage &amp; Generate QR - SkyTrack Air{% endblock %}

{% block content %}
<div class="card" style="max-width: 760px; margin: 0 auto;">
    <div class="card-header">
        <h3>Step 2: Register Passenger Luggage &amp; Generate QR Tag</h3>
    </div>

    <form method="POST" action="{{ url_for('register_luggage') }}">
        <div class="form-group">
            <label for="passenger_id">Select Registered Passenger</label>
            <select id="passenger_id" name="passenger_id" class="form-control" required>
                <option value="">-- Choose Passenger --</option>
                {% for p in passengers %}
                <option value="{{ p.Passenger_ID }}" {% if selected_passenger_id == p.Passenger_ID %}selected{% endif %}>
                    {{ p.Full_Name }} ({{ p.Phone_Number }})
                </option>
                {% endfor %}
            </select>
            <small style="color:#64748b;">Passenger not listed? <a href="{{ url_for('register_passenger') }}">Register passenger first</a>.</small>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label for="destination">Destination Airport / City</label>
                <input type="text" id="destination" name="destination" class="form-control"
                       placeholder="e.g., Lagos (LOS) - Murtala Muhammed Intl" required>
            </div>

            <div class="form-group">
                <label for="weight">Luggage Weight (kg)</label>
                <input type="number" step="0.1" min="0" max="100" id="weight" name="weight"
                       class="form-control" placeholder="e.g., 22.5" required>
            </div>
        </div>

        <div class="form-group">
            <label for="origin_checkpoint">Initial Registration Checkpoint</label>
            <input type="text" id="origin_checkpoint" name="origin_checkpoint" class="form-control"
                   value="Abuja (ABV) - Departure Check-in Desk" required>
        </div>

        <button type="submit" class="btn btn-primary">Register Luggage &amp; Generate Unique QR Code</button>
    </form>
</div>
{% endblock %}
